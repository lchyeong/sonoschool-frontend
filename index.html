<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="192x192" href="/newzest_logo_192.png" />
    <link rel="apple-touch-icon" href="/newzest_logo_192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEWZEST</title>

    <!-- 검색 결과에 노출되는 설명글 (SEO) -->
    <meta
      name="description"
      content="우리의 'Appetite'는 클라이언트의 요구를 충족시키는 것을 넘어, 우리 스스로 설정한 높은 기준에 도달할 때까지 멈추지 않는 집요한 에너지를 의미합니다."
    />

    <!-- SNS 공유 시 보일 설정 (Open Graph) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NEWZEST" />
    <meta property="og:title" content="NEWZEST" />
    <meta
      property="og:description"
      content="브랜드의 미묘한 신호를 포착해 디지털·공간·데이터 경험으로 구현합니다."
    />
    <meta property="og:url" content="%VITE_SITE_URL%" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-thumbnail.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="NEWZEST" />

    <!-- Twitter/X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NEWZEST" />
    <meta
      name="twitter:description"
      content="브랜드의 미묘한 신호를 포착해 디지털·공간·데이터 경험으로 구현합니다."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-thumbnail.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
