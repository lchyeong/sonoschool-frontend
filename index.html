<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />

    <link rel="apple-touch-icon" href="/SRDMS_symbol_192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SONO SCHOOL</title>

    <meta property="og:title" content="SONO SCHOOL" />

      property="og:description"

    <meta name="twitter:card" content="summary_large_image" />

      name="twitter:description"
      content="SONO SCHOOL은 초음파 교육과 학습 정보를 제공하는 교육 사이트입니다."
